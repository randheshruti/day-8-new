{% extends "base.html" %}

{% block content %}

<h1>My Flask Blog</h1>

<div class="grid">
    {% for post in posts %}
    <div class="post">
        <h2>{{ post.title }}</h2>
        <p>{{ post.content }}</p>
        <a href="{{ url_for('post_detail', post_id=post.id) }}">
            Read More
        </a>
    </div>
    {% endfor %}
</div>

{% endblock %}
